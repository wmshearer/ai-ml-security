# Reference only. The docker compose plugin is not available on the test
# box this component was built and run on, so the actual stack is started
# with plain `docker run` in scripts/01-start-stack.sh, not this file. This
# YAML documents the same stack in the more familiar compose form for
# anyone reading this component who has compose available, and is not
# executed anywhere in this component's tests or scripts.
version: "3.8"

networks:
  lateral-net:
    driver: bridge

services:
  ollama:
    image: ollama/ollama:0.5.7@sha256:7e672211886f8bd4448a98ed577e26c816b9e8b052112860564afaa2c105800e
    container_name: lateral-ollama
    networks:
      - lateral-net
    ports:
      - "11434:11434"

  chroma:
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    container_name: lateral-chroma
    networks:
      - lateral-net
    ports:
      - "18001:8000"

  app:
    build: ../app
    image: redteam/lateral-rag-app:latest
    container_name: lateral-app
    networks:
      - lateral-net
    ports:
      - "19000:9000"
    environment:
      CHROMA_URL: "http://lateral-chroma:8000"
      OLLAMA_URL: "http://lateral-ollama:11434"
      OLLAMA_MODEL: "tinyllama"
      INTERNAL_API_TOKEN: "INTERNAL_API_TOKEN_PLANTED_9f3a7c"
    depends_on:
      - ollama
      - chroma
